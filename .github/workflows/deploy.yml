name: Build and deploy

env:
  SITE_URL: https://pean.caiths.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peanup-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: peanup-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: peanup-dist
          path: dist
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured in the production environment"
              exit 1
            fi
          done
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/peanup_deploy
          chmod 600 ~/.ssh/peanup_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 755 /www/wwwroot/pean.caiths.com/releases/$RELEASE_ID"
          rsync -az --delete -e "ssh -i ~/.ssh/peanup_deploy -p $DEPLOY_PORT" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/www/wwwroot/pean.caiths.com/releases/$RELEASE_ID/"
      - name: Activate release
        id: activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          previous="$(ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "readlink -f /www/wwwroot/pean.caiths.com/current 2>/dev/null || true")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s /www/wwwroot/pean.caiths.com/releases/$RELEASE_ID/index.html && ln -sfn /www/wwwroot/pean.caiths.com/releases/$RELEASE_ID /www/wwwroot/pean.caiths.com/current"
      - name: Verify active release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s /www/wwwroot/pean.caiths.com/current/index.html && test \"\$(readlink -f /www/wwwroot/pean.caiths.com/current)\" = \"/www/wwwroot/pean.caiths.com/releases/$RELEASE_ID\""
      - name: Verify public website
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local expected="$2"
            local code=""
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$url" || true)"
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              echo "Attempt $attempt: $url returned $code, expected $expected"
              sleep 5
            done
            return 1
          }

          probe "$SITE_URL/" 200
          probe "$SITE_URL/docs/" 200
          probe "$SITE_URL/docs/engineering/" 200
          probe "$SITE_URL/sitemap.xml" 200
          probe "$SITE_URL/robots.txt" 200
          probe "$SITE_URL/__deployment-smoke-test-not-found__" 404

          read -r redirect_code redirect_url <<< "$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' --max-time 15 "http://pean.caiths.com/" || true)"
          case "$redirect_code" in 301|302|307|308) ;; *) exit 1 ;; esac
          [[ "$redirect_url" == https://pean.caiths.com/* ]]

          asset_headers="$(curl --silent --show-error --head --max-time 15 "$SITE_URL/assets/peanup-product.avif")"
          grep -qi '^x-robots-tag:.*noimageindex' <<< "$asset_headers"
      - name: Roll back failed release
        if: ${{ failure() && steps.activate.outcome == 'success' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
          PREVIOUS_RELEASE: ${{ steps.activate.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_RELEASE" ]; then
            echo "No previous release is available for rollback"
            exit 0
          fi
          ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$PREVIOUS_RELEASE' && test \"\$(readlink -f /www/wwwroot/pean.caiths.com/current)\" = '/www/wwwroot/pean.caiths.com/releases/$RELEASE_ID' && ln -sfn '$PREVIOUS_RELEASE' /www/wwwroot/pean.caiths.com/current"
      - name: Retain five releases
        if: ${{ success() }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/peanup_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "find /www/wwwroot/pean.caiths.com/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf"
